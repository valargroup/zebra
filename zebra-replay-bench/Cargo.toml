[package]
name = "zebra-replay-bench"
version = "0.1.0"
authors.workspace = true
description = "Offline benchmark that replays mainnet blocks through the Zebra state committer, isolated from the network"
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "zebra-replay-bench"
path = "src/main.rs"

[features]
default = []
# Enable the zebra-state commit-metrics histograms and render them at the end of
# an `apply` run. Build the bench binary with this to get per-phase attribution.
commit-metrics = ["zebra-state/commit-metrics", "dep:metrics-exporter-prometheus"]

[dependencies]
zebra-chain = { path = "../zebra-chain", version = "9.0.0" }
zebra-state = { path = "../zebra-state", version = "8.0.0" }
zebra-consensus = { path = "../zebra-consensus", version = "8.0.0" }
zebra-network = { path = "../zebra-network", version = "8.0.0", features = ["internal-bench"] }
zebra-node-services = { path = "../zebra-node-services", version = "7.0.0" }
# The production Zakura block-sync apply driver, exposed via `zebrad::bench_api`
# behind `internal-bench`, so `apply-sequencer` can drive the real apply pipeline.
zebrad = { path = "../zebrad", version = "5.0.0-rc.3", default-features = false, features = ["internal-bench"] }

clap = { workspace = true, features = ["derive"] }
color-eyre.workspace = true
crossbeam-channel = { workspace = true }
futures.workspace = true
tower = { workspace = true, features = ["buffer", "util"] }
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "macros", "time"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

metrics-exporter-prometheus = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
