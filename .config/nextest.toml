# Nextest configuration for Zebra
# This file centralizes all test execution configuration.

[profile.default]
fail-fast = true
status-level = "pass"

# --- Test groups ---

# Zakura networking tests dial real iroh/QUIC endpoints and register peers within
# a bounded deadline. Running many of them at once oversubscribes the CPU and
# starves those handshakes/upgrades, which surfaced as flaky timeouts and upgrade
# races in the PR lane (which has no retries). Cap their concurrency so they do
# not starve each other. This complements the generous `TEST_NET_TIMEOUT` deadline
# in the zebra-network testkit: the deadline absorbs slow connects, the group keeps
# the contention that causes them from piling up. It does not exclude any tests, so
# coverage is unchanged.
[test-groups]
zakura-network = { max-threads = 4 }

# --- Platform-specific overrides ---

# Skip Windows-incompatible tests
[[profile.default.overrides]]
platform = 'cfg(target_os = "windows")'

filter = "not test(=trusted_chain_sync_handles_forks_correctly) and not test(=delete_old_databases)"

# Bound the Zakura networking tests (real iroh/QUIC connects) to the serial test
# group defined above. This override lives on the `default` profile so it applies
# to every profile (all-tests, full-tests, ...). It only assigns a test group; it
# does not filter any tests out, so coverage is unchanged.
[[profile.default.overrides]]
filter = "package(zebra-network) and (test(~zakura::legacy_gossip::tests) or test(~zakura::testkit::cluster::tests) or test(~zakura::testkit::gossip::tests) or test(~zakura::testkit::mock_blocksync) or test(~mutual_p2p))"
test-group = "zakura-network"

# --- All Tests profile ---
# CI-friendly test selection.
#
# Runs fast unit/integration tests and explicitly excludes:
# - 'check_no_git_dependencies' (it has its own profile)
# - stateful or long-running tests that require a local cache dir or external
#   services (lightwalletd RPC/GRPC, full sync, checkpoint generation, mining
#   RPCs, etc.).
#
# Notes:
# - CI now provides a default cache directory, so stateful tests are no longer
#   auto-skipped when the cache dir is undefined. To keep this profile fast and
#   deterministic, we exclude those tests here and offer dedicated profiles
#   below for running them when needed.
# TODO: We need a better test architecture to run all non-stateful
[profile.all-tests]
failure-output = "immediate"
default-filter = "not test(check_no_git_dependencies) and not test(=fully_synced_rpc_z_getsubtreesbyindex_snapshot_test) and not test(=lwd_rpc_test) and not test(=lwd_rpc_send_tx) and not test(=lwd_grpc_wallet) and not test(=lwd_integration) and not test(=lwd_sync_full) and not test(=lwd_sync_update) and not test(=lightwalletd_test_suite) and not test(=rpc_get_block_template) and not test(=rpc_submit_block) and not test(=get_peer_info) and not test(~generate_checkpoints_) and not test(=sync_update_mainnet) and not test(=activate_mempool_mainnet) and not test(=sync_large_checkpoints_mempool_mainnet) and not test(cluster_forms_native_two_node_mesh) and not test(=pruned_storage_mode_prunes_during_regtest_sync)"

# --- Full Tests profile ---
# Broader coverage for `ironwood-main`, scheduled, manual, and merge-queue runs.
# This preserves the previous `all-tests` selection while the PR lane stays fast.
[profile.full-tests]
failure-output = "immediate"
default-filter = "not test(check_no_git_dependencies) and not test(=fully_synced_rpc_z_getsubtreesbyindex_snapshot_test) and not test(=lwd_rpc_test) and not test(=lwd_rpc_send_tx) and not test(=lwd_grpc_wallet) and not test(=lwd_integration) and not test(=lwd_sync_full) and not test(=lwd_sync_update) and not test(=lightwalletd_test_suite) and not test(=rpc_get_block_template) and not test(=rpc_submit_block) and not test(=get_peer_info) and not test(~generate_checkpoints_) and not test(=sync_update_mainnet) and not test(=activate_mempool_mainnet) and not test(=sync_large_checkpoints_mempool_mainnet) and not test(cluster_forms_native_two_node_mesh)"

# --- Individual Test Profiles ---

[profile.check-no-git-dependencies]
default-filter = 'test(check_no_git_dependencies)'

[profile.zakura-integration]
retries = 2
slow-timeout = { period = "15m", terminate-after = 1 }
default-filter = 'package(zebra-network) and test(~zakura)'

[profile.sync-large-checkpoints-empty]
slow-timeout = { period = "60m", terminate-after = 2 }
default-filter = 'package(zebrad) and test(=sync_large_checkpoints_empty)'

[profile.sync-full-mainnet]
slow-timeout = { period = "30000m", terminate-after = 1 }
success-output = "immediate"
default-filter = 'package(zebrad) and test(=sync_full_mainnet)'

