name: Sync confidence

# Semantically verifies two fixed windows of real mainnet blocks that bracket the
# NU6.2 soft fork, to catch consensus/verification regressions that would break
# our ability to sync. Each window restores a fresh disk from an immutable
# per-window snapshot image, syncs ~5k blocks with full validation, and asserts it
# reaches the configured stop height with a contextually-verified commit.
#
# Snapshot images are built rarely by `sync-confidence-snapshots.yml`.

on:
  push:
    branches:
      - ironwood-main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build CI Docker
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      statuses: write
    uses: ./.github/workflows/zfnd-build-docker-image.yml
    with:
      dockerfile_path: ./docker/Dockerfile
      dockerfile_target: tests
      image_name: ${{ vars.CI_IMAGE_NAME }}
      no_cache: false
      rust_backtrace: full
      rust_lib_backtrace: full
      rust_log: info
      features: ${{ format('{0} {1}', vars.RUST_PROD_FEATURES, vars.RUST_TEST_FEATURES) }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  pre-nu62:
    needs: [build]
    name: Sync range pre-NU6.2 (full validation)
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/zfnd-deploy-integration-tests-gcp.yml
    secrets:
      GCP_SSH_PRIVATE_KEY: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
    with:
      app_name: zebrad
      test_id: sync-range-pre-nu62
      test_description: Full-validation sync of ~5k mainnet blocks below NU6.2
      test_variables: "ZEBRA_NETWORK__NETWORK=Mainnet,NEXTEST_PROFILE=sync-range-pre-nu62,TEST_SYNC_RANGE=1"
      network: Mainnet
      needs_zebra_state: true
      saves_to_disk: false
      disk_suffix: synctest-pre-nu62

  post-nu62:
    needs: [build]
    name: Sync range post-NU6.2 (full validation)
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/zfnd-deploy-integration-tests-gcp.yml
    secrets:
      GCP_SSH_PRIVATE_KEY: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
    with:
      app_name: zebrad
      test_id: sync-range-post-nu62
      test_description: Full-validation sync of ~5k mainnet blocks above NU6.2
      test_variables: "ZEBRA_NETWORK__NETWORK=Mainnet,NEXTEST_PROFILE=sync-range-post-nu62,TEST_SYNC_RANGE=1"
      network: Mainnet
      needs_zebra_state: true
      saves_to_disk: false
      disk_suffix: synctest-post-nu62
