name: Sync confidence

# Full-validation sync of two fixed mainnet windows bracketing the NU6.2 soft
# fork, to catch consensus regressions that would break sync. Builds the test
# image once (GHCR), then runs each window on an ephemeral DigitalOcean droplet
# that restores pruned cached state from Spaces. Snapshots are produced
# out-of-band by make-sync-confidence-snapshots.sh. See docs/sync-confidence-do-setup.md.

on:
  push:
    branches:
      - ironwood-main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # NOTE: the image build here produces the same image used for snapshot generation
  # (make-sync-confidence-snapshots.sh). Keep the build-args and Dockerfile target in sync.
  build:
    name: Build test image (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # Single-valued by construction (one metadata tag rule); robust if tags are added later.
      image_ref: ghcr.io/${{ github.repository }}-tests:${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf
        with:
          images: ghcr.io/${{ github.repository }}-tests
          tags: type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          file: ./docker/Dockerfile
          target: tests
          platforms: linux/amd64
          build-args: FEATURES=default-release-binaries
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pre-nu62:
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/do-sync-test.yml
    secrets:
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      SPACES_ACCESS_KEY: ${{ secrets.SPACES_ACCESS_KEY }}
      SPACES_SECRET_KEY: ${{ secrets.SPACES_SECRET_KEY }}
      DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
    with:
      state_key: pre-nu62
      nextest_profile: sync-range-pre-nu62
      test_variables: "ZEBRA_NETWORK__NETWORK=Mainnet,TEST_SYNC_RANGE=1"
      image_ref: ${{ needs.build.outputs.image_ref }}
      droplet_size: g-8vcpu-32gb

  post-nu62:
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/do-sync-test.yml
    secrets:
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      SPACES_ACCESS_KEY: ${{ secrets.SPACES_ACCESS_KEY }}
      SPACES_SECRET_KEY: ${{ secrets.SPACES_SECRET_KEY }}
      DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
    with:
      state_key: post-nu62
      nextest_profile: sync-range-post-nu62
      test_variables: "ZEBRA_NETWORK__NETWORK=Mainnet,TEST_SYNC_RANGE=1"
      image_ref: ${{ needs.build.outputs.image_ref }}
      droplet_size: g-8vcpu-32gb
