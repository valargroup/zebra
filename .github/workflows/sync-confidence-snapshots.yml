name: Sync confidence snapshots

# Manually-run: builds the cached-state tarballs (in Spaces) that
# sync-confidence.yml restores from. Re-run after the DB format version changes
# (state objects are keyed by version). post-nu62 syncs genesis->3,375,000 and is
# long-running, so size its droplet for the full finalized state.

on:
  workflow_dispatch:
  push: # TEMP: branch validation; remove before merge to main
    branches:
      - adam/sync-confidence-ci

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # NOTE: keep this build job in sync with sync-confidence.yml.
  build:
    name: Build test image (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # Single-valued by construction (one metadata tag rule); robust if tags are added later.
      image_ref: ghcr.io/${{ github.repository }}-tests:${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf
        with:
          images: ghcr.io/${{ github.repository }}-tests
          tags: type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          file: ./docker/Dockerfile
          target: tests
          platforms: linux/amd64
          build-args: FEATURES=default-release-binaries
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  generate-pre-nu62:
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/do-sync-test.yml
    secrets:
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      SPACES_ACCESS_KEY: ${{ secrets.SPACES_ACCESS_KEY }}
      SPACES_SECRET_KEY: ${{ secrets.SPACES_SECRET_KEY }}
      DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
    with:
      mode: generate
      state_key: pre-nu62
      nextest_profile: generate-snapshot-pre-nu62
      test_variables: "ZEBRA_NETWORK__NETWORK=Mainnet,TEST_GENERATE_SYNC_RANGE_SNAPSHOT=1"
      image_ref: ${{ needs.build.outputs.image_ref }}
      droplet_size: s-8vcpu-16gb

  generate-post-nu62:
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/do-sync-test.yml
    secrets:
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      SPACES_ACCESS_KEY: ${{ secrets.SPACES_ACCESS_KEY }}
      SPACES_SECRET_KEY: ${{ secrets.SPACES_SECRET_KEY }}
      DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
    with:
      mode: generate
      state_key: post-nu62
      nextest_profile: generate-snapshot-post-nu62
      test_variables: "ZEBRA_NETWORK__NETWORK=Mainnet,TEST_GENERATE_SYNC_RANGE_SNAPSHOT=1"
      image_ref: ${{ needs.build.outputs.image_ref }}
      droplet_size: s-8vcpu-16gb
