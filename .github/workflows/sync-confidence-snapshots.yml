name: Sync confidence snapshots

# Builds the cached-state snapshot disks that `sync-confidence.yml` restores from.
# Run manually to seed the disks the first time, and again after the database
# format version (LOCAL_STATE_VERSION in zebra-state/src/constants.rs) changes —
# disk images are keyed by state version, so a bump invalidates the old images.
#
# pre-nu62 is a fast checkpoint sync to 3,358,006.
# post-nu62 syncs to 3,400,000 (checkpoints to 3,358,006, then ~42k full-validation
# blocks) and can run for a while; it is marked is_long_test.

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build CI Docker
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      statuses: write
    uses: ./.github/workflows/zfnd-build-docker-image.yml
    with:
      dockerfile_path: ./docker/Dockerfile
      dockerfile_target: tests
      image_name: ${{ vars.CI_IMAGE_NAME }}
      no_cache: false
      rust_backtrace: full
      rust_lib_backtrace: full
      rust_log: info
      features: ${{ format('{0} {1}', vars.RUST_PROD_FEATURES, vars.RUST_TEST_FEATURES) }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  generate-pre-nu62:
    needs: [build]
    name: Generate pre-NU6.2 snapshot (height 3,358,006)
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/zfnd-deploy-integration-tests-gcp.yml
    secrets:
      GCP_SSH_PRIVATE_KEY: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
    with:
      app_name: zebrad
      test_id: generate-snapshot-pre-nu62
      test_description: Build cached state at the top mainnet checkpoint (3,358,006)
      test_variables: "ZEBRA_NETWORK__NETWORK=Mainnet,NEXTEST_PROFILE=generate-snapshot-pre-nu62,TEST_GENERATE_SYNC_RANGE_SNAPSHOT=1"
      network: Mainnet
      needs_zebra_state: false
      saves_to_disk: true
      force_save_to_disk: true
      disk_suffix: synctest-pre-nu62
      height_grep_text: 'current_height.*=.*Height.*\('

  generate-post-nu62:
    needs: [build]
    name: Generate post-NU6.2 snapshot (height 3,400,000)
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/zfnd-deploy-integration-tests-gcp.yml
    secrets:
      GCP_SSH_PRIVATE_KEY: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
    with:
      app_name: zebrad
      test_id: generate-snapshot-post-nu62
      test_description: Build cached state at mainnet height 3,400,000
      test_variables: "ZEBRA_NETWORK__NETWORK=Mainnet,NEXTEST_PROFILE=generate-snapshot-post-nu62,TEST_GENERATE_SYNC_RANGE_SNAPSHOT=1"
      network: Mainnet
      needs_zebra_state: false
      saves_to_disk: true
      force_save_to_disk: true
      disk_suffix: synctest-post-nu62
      is_long_test: true
      height_grep_text: 'current_height.*=.*Height.*\('
